{% extends "base.html" %}
{% block title %}登录 - 直播源管理器{% endblock %}
{% block page_title %}登录{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>直播源管理器</h2>
        <p>Live Source Manager — Web 管理</p>
    </div>
    <form hx-post="/api/auth/login"
          hx-target="body"
          hx-push-url="/"
          hx-indicator="#login-spinner"
          class="login-form">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <div class="pwd-input-wrap">
                <input type="password" id="password" name="password" class="form-input" required>
                <button type="button" class="btn btn-sm btn-outline pwd-toggle" id="password-toggle" aria-label="显示密码">显示</button>
            </div>
            <small class="form-help pwd-capslock" id="password-capslock" style="display:none">⚠️ 大写锁定已开启（CapsLock）</small>
        </div>
        <div id="login-error" class="alert alert-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
            <span id="login-spinner" class="spinner htmx-indicator"></span>
            登录
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/pages/auth.js"></script>
{% endblock %}
