# =============================================================
# GitHub Actions — 测试 + 自动构建推送 Docker 镜像到 GHCR
# =============================================================
# 触发：
#   - push 到 master 分支（每次推送代码都会重新构建镜像）
#   - 手动触发（workflow_dispatch）
#
# Job 划分（D-07）：
#   test           — 先跑全量 pytest，绿了才允许构建（境外 Runner 用 PyPI 官方源）
#   build-and-push — needs: test；多架构构建 amd64+arm64 并推送到 GHCR
#
# 镜像产物：
#   ghcr.io/yuanshandalishuishou/live-source-manager:latest
#   ghcr.io/yuanshandalishuishou/live-source-manager:master
#   ghcr.io/yuanshandalishuishou/live-source-manager:sha-<commit>
#
# 权限：使用仓库内置 GITHUB_TOKEN（packages: write），无需任何 PAT。
# =============================================================

name: Build and Push Docker Image

on:
  push:
    # 每次推送代码到主干都会重新构建并推送镜像。
    # 同时监听 main：若日后把默认分支从 master 改名为 main，自动化不会断。
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # provenance/sbom 证明生成需要；actions:read 用于 GHA 缓存后端
  id-token: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: 测试门禁（构建前必须全绿）────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dev dependencies (PyPI official source)
        # requirements-dev.txt 不含任何国内镜像源，境外 Runner 直连 PyPI 即可
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: PYTHONPATH=. pytest tests/ -q

  # ── Job 2: 多架构构建并推送（needs: test）───────────────
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore official mirrors (GitHub Runner is outside CN)
        # Dockerfile 默认把 deb.debian.org / pypi.tuna 替换为清华镜像源以加速国内
        # 本地构建；但在 GitHub 境外 Runner 上清华源不可达，会导致 apt-get update /
        # pip install 失败。构建前在「工作区」内还原为官方源（不改动提交、不影响
        # 国内用户本地 docker build 体验）。
        run: |
          sed -i 's#mirrors.tuna.tsinghua.edu.cn#deb.debian.org#g' Dockerfile
          sed -i 's#pypi.tuna.tsinghua.edu.cn#pypi.org#g' Dockerfile
          echo "--- Dockerfile 镜像源行（确认已还原为官方源）---"
          grep -nE "deb.debian.org|pypi.org|tuna" Dockerfile || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull base image (mitigate Docker Hub rate limit)
        # GitHub Hosted Runner 拉取 Docker Hub 公共镜像偶发触发匿名限速
        # (toomanyrequests)。预先 docker pull 并带重试，提高首启成功率。
        run: |
          for i in 1 2 3; do
            if docker pull python:3.13-slim-bookworm; then
              echo "base image pulled"; break
            fi
            echo "pull attempt $i failed, retry in 15s"; sleep 15
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Live Source Manager
            org.opencontainers.image.description=Live source manager (FastAPI + Nginx + SQLite)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 多架构：Dockerfile 用 apt 装 ffmpeg，bookworm 对 amd64/arm64 均有包，
          # 零改动支持双架构（armv7 不构建，见 docs/BACKLOG.md）
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=python:3.13-slim-bookworm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance/sbom 证明生成，避免需要额外权限导致推送阶段失败
          provenance: false
          sbom: false

      # 构建并推送成功后，自动将包设为 public，
      # 这样其他人无需登录 ghcr.io 即可 `docker pull` 直接运行（李总要求）。
      # 用仓库内置 GITHUB_TOKEN（含 packages: write），不依赖任何 PAT。
      - name: Make package public (others can docker pull without auth)
        if: success()
        run: |
          echo "Setting package visibility to public..."
          PKG_FULL="${{ github.repository }}"
          PKG_ENC="$(echo "$PKG_FULL" | sed 's#/#%2F#g')"
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG_ENC}/visibility" \
            -d '{"visibility":"public"}' \
            -w "PATCH_HTTP %{http_code}\n" \
            || echo "set-public skipped (manual action needed)"
